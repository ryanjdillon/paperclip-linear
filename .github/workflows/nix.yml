name: nix

on:
  pull_request:
    paths: ["**.nix", "flake.lock"]
  push:
    branches: [main]
    paths: ["**.nix", "flake.lock"]

permissions:
  contents: read

# A new push to a PR cancels the PR's older run. A push to main gets its own
# group (the commit), so a main run is never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    uses: ryanjdillon/workflows/.github/workflows/nix-check.yml@5a8a9389d9ff1826df8b4ab8d8a0cce3936693a4 # v1.2.0
