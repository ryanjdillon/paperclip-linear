name: agents-md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ryanjdillon/workflows/check-instructions@5a8a9389d9ff1826df8b4ab8d8a0cce3936693a4 # v1.2.0
