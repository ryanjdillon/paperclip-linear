name: image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "package.json", "pnpm-lock.yaml", ".github/workflows/image.yml"]

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ryanjdillon/workflows/.github/workflows/docker-build-push.yml@5a8a9389d9ff1826df8b4ab8d8a0cce3936693a4 # v1.2.0
    with:
      image: ryanjdillon/paperclip-linear
      platforms: linux/amd64,linux/arm64
      # Pull requests only check that the image builds.
      push: ${{ github.event_name == 'push' }}
