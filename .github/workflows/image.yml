name: image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "package.json", "pnpm-lock.yaml", ".github/workflows/image.yml"]

permissions:
  contents: read

# A new push to a PR cancels the older run of that PR. Each tag push gets
# its own group (the tag), so a release build is not cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ryanjdillon/workflows/.github/workflows/docker-build-push.yml@ebb73dbf81f54d7bf8ddb23e5b8e0783e7926acd # v1.2.2
    with:
      image: ryanjdillon/paperclip-linear
      platforms: linux/amd64,linux/arm64
      # Pull requests only check that the image builds.
      push: ${{ github.event_name == 'push' }}
